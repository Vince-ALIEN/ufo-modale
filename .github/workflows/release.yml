name: "Release new TAG"
on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    name: "Release new TAG"
    runs-on: ubuntu-latest
    permissions:
      # Needed to push the release tag with the default GITHUB_TOKEN.
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - id: check-version
        name: "Check version does not exists"
        run: |
          # Get the version from .plugin-data file and make sure it is a plain semver.
          VERSION="$(jq -r '.version' ./.plugin-data)"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version in .plugin-data: $VERSION";
            exit 1;
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Get Branch tag"
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag already exists, stop now";
            exit 1;
          fi

      - id: build-php
        name: "Build project PHP"
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1
      - run: composer install --prefer-dist --no-dev -o --ignore-platform-reqs

      - id: setup-node
        name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version-file: 'package.json'
          cache: 'npm'

      - id: build-js
        name: "Build JavaScript assets"
        run: |
          echo "Install npm dependencies"
          npm ci
          echo "Build assets"
          npm run build

      - id: commit-and-push
        name: "Commit and push new TAG"
        env:
          VERSION: ${{ steps.check-version.outputs.version }}
        run: |
          echo "Copy .distignore to .gitignore"
          cp .distignore .gitignore

          echo "Configure git"
          git config --local user.email "$(git log --format='%ae' HEAD^!)"
          git config --local user.name "$(git log --format='%an' HEAD^!)"

          echo "Creating branch"
          git checkout -b "release/${VERSION}"

          echo "Creating tag ${VERSION}"
          git add .
          git add -u
          git commit -m "Release version ${VERSION}"
          git tag "${VERSION}"
          git push --tags
